<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200">
  <style>
    .title { font: bold 28px Arial, sans-serif; fill: #111827; }
    .subtitle { font: 16px Arial, sans-serif; fill: #4b5563; }

    .gw-box { fill: #0f766e; stroke: #134e4a; stroke-width: 3; rx: 16; filter: url(#shadow); }
    .gw-text { fill: #f0fdfa; font: bold 16px Arial, sans-serif; }

    .vlan-box { fill: #f9fafb; stroke-width: 3; rx: 16; filter: url(#shadow); }
    .vlan-title { font: bold 18px Arial, sans-serif; fill: #111827; }

    .host-box { fill-opacity: 0.95; stroke-width: 2; rx: 10; filter: url(#shadow); }
    .host-text { font: 13px monospace; font-weight: bold; }

    .icon { font: bold 20px Arial, sans-serif; }

    .line { stroke: #374151; stroke-width: 2; stroke-dasharray: 4,2; }

  </style>

  <!-- Shadow filter -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="40" y="40" class="title">Mapa de Rede – VLANs  Homelab</text>  

  <!-- Gateway -->
  <rect x="700" y="100" width="240" height="80" class="gw-box"/>
  <text x="730" y="140" class="gw-text">🌐 OPNsense Gateway</text>
  <text x="730" y="165" class="gw-text">Firewall • VLAN Routing</text>

  <!-- VLAN10 – vmbro_local -->
  <rect x="50" y="220" width="320" height="780" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" rx="16" filter="url(#shadow)"/>
  <text x="70" y="250" class="vlan-title">VLAN10 - Work</text>
  <text x="70" y="275" class="subtitle">172.16.10.0/24</text>

  <!-- Hosts VLAN10 -->
  <g transform="translate(70,300)">
    <rect x="0" y="0" width="280" height="30" class="host-box" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="30" y="20" class="host-text">🐧 Bookstack — 172.16.10.22</text>

    <rect x="0" y="42" width="280" height="30" class="host-box" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="30" y="62" class="host-text">🐧 Immich — 172.16.10.71</text>

    <rect x="0" y="84" width="280" height="30" class="host-box" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="30" y="104" class="host-text">🐧 WatchYourLAN — 172.16.10.107</text>

    <rect x="0" y="126" width="280" height="30" class="host-box" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="30" y="146" class="host-text">🐧 Zima-OS — 172.16.10.117</text>

    <rect x="0" y="168" width="280" height="30" class="host-box" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="30" y="188" class="host-text">🐧 PDTM — 172.16.10.118</text>

    <rect x="0" y="210" width="280" height="30" class="host-box" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="30" y="230" class="host-text">🐧 forgejo — 172.16.10.125</text>

    <rect x="0" y="252" width="280" height="30" class="host-box" fill="#059669" stroke="#047857"/>
    <text x="30" y="272" class="host-text">🗄️ NAS — 172.16.10.188</text>

    <rect x="0" y="294" width="280" height="30" class="host-box" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="30" y="314" class="host-text">🐧 Mail — 172.16.10.190</text>

    <rect x="0" y="336" width="280" height="30" class="host-box" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="30" y="356" class="host-text">🐧 Pgsql — 172.16.10.253</text>

    <rect x="0" y="378" width="280" height="30" class="host-box" fill="#facc15" stroke="#ca8a04"/>
    <text x="30" y="398" class="host-text">🖥️ Windows AD — 172.16.10.50</text>

    <rect x="0" y="420" width="280" height="30" class="host-box" fill="#dc2626" stroke="#b91c1c"/>
    <text x="30" y="440" class="host-text">🔒 Wazuh — 172.16.10.60</text>
  </g>

  <!-- VLAN20 – Security -->
  <rect x="400" y="220" width="320" height="220" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" rx="16" filter="url(#shadow)"/>
  <text x="420" y="250" class="vlan-title">VLAN20 – Security</text>
  <text x="420" y="275" class="subtitle">172.16.20.0/24</text>

  <g transform="translate(420,300)">
    <rect x="0" y="0" width="280" height="30" class="host-box" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="30" y="20" class="host-text">🐧 Parrot — 172.16.20.41</text>

    <rect x="0" y="42" width="280" height="30" class="host-box" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="30" y="62" class="host-text">🐧 Kali — 172.16.20.42</text>
  </g>

  <!-- VLAN30 – Apps -->
  <rect x="750" y="220" width="320" height="300" fill="#ede9fe" stroke="#7c3aed" stroke-width="3" rx="16" filter="url(#shadow)"/>
  <text x="770" y="250" class="vlan-title">VLAN30 – Applications</text>
  <text x="770" y="275" class="subtitle">172.16.30.0/24</text>

  <g transform="translate(770,300)">
    <rect x="0" y="0" width="280" height="30" class="host-box" fill="#4ade80" stroke="#16a34a"/>
    <text x="30" y="20" class="host-text">🌐 Homepage — 172.16.30.63</text>

    <rect x="0" y="42" width="280" height="30" class="host-box" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="30" y="62" class="host-text">🐧 Ubuntu VM — 172.16.30.67</text>

    <rect x="0" y="84" width="280" height="30" class="host-box" fill="#4ade80" stroke="#16a34a"/>
    <text x="30" y="104" class="host-text">🌐 N8N — 172.16.30.72</text>

    <rect x="0" y="126" width="280" height="30" class="host-box" fill="#facc15" stroke="#ca8a04"/>
    <text x="30" y="146" class="host-text">🔧 IT-Tools — 172.16.30.76</text>
  </g>

  <!-- VLAN40 – Core -->
  <rect x="1100" y="220" width="320" height="260" fill="#fef2f2" stroke="#dc2626" stroke-width="3" rx="16" filter="url(#shadow)"/>
  <text x="1120" y="250" class="vlan-title">VLAN40 – Core / Sensitive</text>
  <text x="1120" y="275" class="subtitle">172.16.40.0/24</text>

  <g transform="translate(1120,300)">
    <rect x="0" y="0" width="280" height="30" class="host-box" fill="#dc2626" stroke="#b91c1c"/>
    <text x="30" y="20" class="host-text">🔒 bitwarden — 172.16.40.164</text>

    <rect x="0" y="42" width="280" height="30" class="host-box" fill="#4ade80" stroke="#16a34a"/>
    <text x="30" y="62" class="host-text">🌐 Nextcloud — 172.16.40.100</text>

    <rect x="0" y="84" width="280" height="30" class="host-box" fill="#facc15" stroke="#ca8a04"/>
    <text x="30" y="104" class="host-text">🔧 Docker — 172.16.40.200</text>
  </g>

  <!-- Links -->
  <line x1="820" y1="140" x2="210" y2="220" class="line"/>
  <line x1="820" y1="140" x2="540" y2="220" class="line"/>
  <line x1="820" y1="140" x2="870" y2="220" class="line"/>
  <line x1="820" y1="140" x2="1210" y2="220" class="line"/>
</svg>

